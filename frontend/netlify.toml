[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback for routes that weren't prerendered (e.g. /blog/<new-slug>).
# Prerendered .html files are served first because they exist on disk.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
